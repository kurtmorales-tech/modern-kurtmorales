name = "kurtmorales-modern"
main = "src/worker.ts"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "dist", binding = "ASSETS", html_handling = "auto-trailing-slash" }

routes = [
  { pattern = "kurtmorales.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://kurtmorales.com"

[placement]
mode = "smart"
