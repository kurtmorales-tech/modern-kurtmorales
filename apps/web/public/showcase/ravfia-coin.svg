<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ravfia Coin RFCN SVG</title>
  <desc id="desc">Vector-style crypto coin for Ravfia Coin, symbol RFCN, with metallic gold rim, dark circuit face, and stylized R emblem.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14224f"/>
      <stop offset="45%" stop-color="#090d22"/>
      <stop offset="100%" stop-color="#02040c"/>
    </radialGradient>
    <radialGradient id="coinFace" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a2a24"/>
      <stop offset="55%" stop-color="#10100f"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="gold" x1="14%" y1="5%" x2="84%" y2="95%">
      <stop offset="0%" stop-color="#fff0a3"/>
      <stop offset="14%" stop-color="#d8a83a"/>
      <stop offset="35%" stop-color="#805313"/>
      <stop offset="57%" stop-color="#f8dc78"/>
      <stop offset="73%" stop-color="#a56e1d"/>
      <stop offset="100%" stop-color="#ffe891"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e420d"/>
      <stop offset="38%" stop-color="#e2b64d"/>
      <stop offset="52%" stop-color="#fff0a6"/>
      <stop offset="73%" stop-color="#9a6319"/>
      <stop offset="100%" stop-color="#f6d46c"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="55%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#29220f"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="38" stdDeviation="25" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffcf56" flood-opacity="0.65"/>
    </filter>
    <filter id="neonGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7b2cff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#00d9ff" flood-opacity="0.35"/>
    </filter>
    <path id="topTextPath" d="M 270 525 A 330 330 0 0 1 930 525"/>
    <path id="bottomTextPath" d="M 930 675 A 330 330 0 0 1 270 675"/>
    <pattern id="circuitPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M12 22 H50 V42 H88 M34 82 H74 V62 H108 M15 104 H42 M80 18 H105 M54 15 V48 M90 68 V102" fill="none" stroke="#cfa64a" stroke-width="2" opacity="0.42"/>
      <circle cx="12" cy="22" r="3" fill="#cfa64a" opacity="0.5"/>
      <circle cx="88" cy="42" r="3" fill="#cfa64a" opacity="0.5"/>
      <circle cx="108" cy="62" r="3" fill="#cfa64a" opacity="0.5"/>
      <circle cx="42" cy="104" r="3" fill="#cfa64a" opacity="0.5"/>
      <circle cx="105" cy="18" r="3" fill="#cfa64a" opacity="0.5"/>
    </pattern>
    <clipPath id="faceClip"><circle cx="600" cy="600" r="335"/></clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGlow)"/>
  <ellipse cx="600" cy="930" rx="410" ry="80" fill="none" stroke="#762dff" stroke-width="8" opacity="0.55" filter="url(#neonGlow)"/>
  <ellipse cx="600" cy="930" rx="360" ry="58" fill="none" stroke="#00d9ff" stroke-width="4" opacity="0.45"/>

  <g filter="url(#softShadow)">
    <circle cx="600" cy="600" r="410" fill="url(#gold)"/>
    <circle cx="600" cy="600" r="382" fill="url(#rimDark)" stroke="#f5d26c" stroke-width="8"/>
    <circle cx="600" cy="600" r="345" fill="url(#coinFace)" stroke="#8d611e" stroke-width="7"/>
    <circle cx="600" cy="600" r="322" fill="none" stroke="#d3a64b" stroke-width="2" opacity="0.55"/>
    <circle cx="600" cy="600" r="292" fill="none" stroke="#5a451c" stroke-width="3" opacity="0.8"/>
    <circle cx="600" cy="600" r="260" fill="none" stroke="#d0a14a" stroke-width="1.5" opacity="0.35"/>

    <g clip-path="url(#faceClip)">
      <rect x="245" y="245" width="710" height="710" fill="url(#circuitPattern)" opacity="0.55"/>
      <g opacity="0.25" stroke="#f4c45a" fill="none">
        <circle cx="600" cy="600" r="230" stroke-width="2"/>
        <circle cx="600" cy="600" r="188" stroke-width="1.5"/>
        <circle cx="600" cy="600" r="145" stroke-width="1.2"/>
      </g>
    </g>

    <g font-family="Orbitron, Montserrat, Arial, sans-serif" letter-spacing="13" font-weight="700" fill="#f3cf71">
      <text font-size="45">
        <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">RAVFIA COIN</textPath>
      </text>
      <text font-size="31" letter-spacing="9">
        <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">DECENTRALIZED • SECURE • SCALABLE</textPath>
      </text>
    </g>

    <g fill="url(#gold2)" stroke="#4a2e08" stroke-width="7" filter="url(#goldGlow)">
      <path d="M420 390 H730 C810 390 858 438 858 508 C858 573 815 620 745 628 L858 775 H735 L630 638 H548 V775 H428 V546 H618 C684 546 730 522 730 486 C730 452 700 435 644 435 H420 Z"/>
      <path d="M426 548 L548 638 L548 775 L426 775 Z" opacity="0.92"/>
    </g>

    <g font-family="Orbitron, Montserrat, Arial, sans-serif" text-anchor="middle" fill="#f0c45c" filter="url(#goldGlow)">
      <text x="600" y="786" font-size="58" font-weight="700" letter-spacing="6">RAVFIA COIN</text>
      <line x1="425" y1="842" x2="508" y2="842" stroke="#d0a04a" stroke-width="5"/>
      <text x="600" y="858" font-size="54" font-weight="700" letter-spacing="12">RFCN</text>
      <line x1="692" y1="842" x2="775" y2="842" stroke="#d0a04a" stroke-width="5"/>
    </g>

    <g fill="#f4c760" opacity="0.85">
      <circle cx="280" cy="601" r="6"/><circle cx="920" cy="601" r="6"/>
      <circle cx="315" cy="430" r="5"/><circle cx="885" cy="430" r="5"/>
      <circle cx="348" cy="770" r="5"/><circle cx="852" cy="770" r="5"/>
    </g>

    <circle cx="600" cy="600" r="408" fill="none" stroke="#fff1a0" stroke-width="4" opacity="0.65"/>
    <circle cx="600" cy="600" r="413" fill="none" stroke="#6a3f0c" stroke-width="9" opacity="0.65"/>
  </g>

  <g opacity="0.75" filter="url(#neonGlow)">
    <path d="M160 595 C250 250 555 118 825 230" fill="none" stroke="#8f3dff" stroke-width="8" opacity="0.35"/>
    <path d="M405 980 C650 1045 910 960 1030 780" fill="none" stroke="#00d9ff" stroke-width="5" opacity="0.22"/>
  </g>
</svg>
