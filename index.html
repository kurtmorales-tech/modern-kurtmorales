<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kurt Morales | Portfolio</title>

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="Kurt Morales - Personal portfolio showcasing web development projects, skills, and professional experience. Built with React, TypeScript, and Tailwind CSS."
        />
        <meta
            name="keywords"
            content="Kurt Morales, portfolio, web developer, React, TypeScript, frontend developer"
        />
        <meta name="author" content="Kurt Morales" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://kmwebdesign.xyz" />
        <meta property="og:title" content="Kurt Morales | Portfolio" />
        <meta
            property="og:description"
            content="Kurt Morales - Personal portfolio showcasing web development projects, skills, and professional experience."
        />
        <meta
            property="og:image"
            content="https://kmwebdesign.xyz/og-image.png"
        />
        <meta property="og:site_name" content="Kurt Morales Portfolio" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://kmwebdesign.xyz" />
        <meta property="twitter:title" content="Kurt Morales | Portfolio" />
        <meta
            property="twitter:description"
            content="Kurt Morales - Personal portfolio showcasing web development projects, skills, and professional experience."
        />
        <meta
            property="twitter:image"
            content="https://kmwebdesign.xyz/og-image.png"
        />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="/newfavicon.png" />

        <!-- Theme Color for Mobile Browsers -->
        <meta name="theme-color" content="#0f172a" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
